<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<style>
body{
font-family: 'Segoe UI', sans-serif;
background:#f5f5f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#ffffff;
padding:25px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
width:300px;
text-align:center;
}

h2{
color:#444;
margin-bottom:15px;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

button{
padding:10px 14px;
margin:6px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
background:#e6e8ec;
color:#333;
transition:0.2s;
}

button:hover{
background:#d8dbe0;
}

.clear{
background:#cfd3da;
}

#result{
margin-top:15px;
color:#555;
font-weight:500;
}
</style>

</head>

<body>

<div class="box">

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="Enter Number 1">
<input type="number" id="num2" placeholder="Enter Number 2">

<br>

<button onclick="calc('+')">+</button>
<button onclick="calc('-')">−</button>
<button onclick="calc('*')">×</button>
<button onclick="calc('/')">÷</button>
<button class="clear" onclick="clearAll()">Clear</button>

<h3 id="result">Result:</h3>

</div>

<script>

function calc(op){

let a = Number(document.getElementById("num1").value);
let b = Number(document.getElementById("num2").value);
let r;

if(op=="+") r = a + b;
else if(op=="-") r = a - b;
else if(op=="*") r = a * b;
else if(op=="/") r = b==0 ? "Cannot divide by 0" : a/b;

document.getElementById("result").innerHTML="Result: "+r;

}

function clearAll(){
document.getElementById("num1").value="";
document.getElementById("num2").value="";
document.getElementById("result").innerHTML="Result:";
}

</script>

</body>
</html>
